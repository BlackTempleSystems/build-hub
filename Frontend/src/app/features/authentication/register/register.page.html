<div class="min-h-screen w-full flex items-center justify-center">
    <form class="flex flex-col w-80 gap-4 p-5 login-container h-100 shadow-2xl">
        <h1 class="text-center text-2xl font-semibold pb-8">Register</h1>
        <div class="credentials-control-group flex flex-col gap-6">
            <p-floatlabel>
                <input type="text" name="login-username" id="login-username" class="w-full" autocomplete="on"
                    [formControl]="userName" pInputText />
                <label for="register-username">Username</label>
            </p-floatlabel>
            <p-floatlabel>
                <p-password [toggleMask]="true" name="password" id="password" [formControl]="password" [fluid]="true">
                </p-password>
                <label for="confirm-password">Password</label>
            </p-floatlabel>
            <p-floatlabel>
                <p-password [toggleMask]="true" name="confirm-password" id="confirm-password"
                    [formControl]="confirmPassword" [fluid]="true">
                </p-password>
                <label for="confirm-password">Confirm Password</label>
            </p-floatlabel>
        </div>
        <div class="flex flex-col gap-4 mt-2">
            <button pButton type="submit">Register</button>
        </div>
    </form>
</div>
